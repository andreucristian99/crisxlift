<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel Cris">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/favicon.png">
<title>Panel de entrenador</title>
<style>
:root{--bg:#0a0a0b;--surface:#161618;--surface-2:#232326;--line:rgba(255,255,255,.08);--fg:#f5f5f5;--muted:#8d8d93;--accent:#ff8a3d;--ok:#4ade80;--warn:#facc15;--bad:#f87171;
  --display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 10px;margin:0 -16px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-weight:900;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.brand span{color:var(--accent)}
.icon-b{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr .8fr;gap:4px;background:var(--surface);border-radius:14px;padding:4px;margin-top:12px}
.seg button{border:0;background:none;border-radius:10px;padding:10px 4px;font-weight:700;font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#1a1205}
.upd{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
h1,h2,h3{margin:0}
.btn{width:100%;border:0;border-radius:14px;background:var(--accent);color:#1a1205;font-weight:800;padding:14px;font-size:16px}
.ghost{width:100%;border:1px solid var(--line);border-radius:14px;background:none;padding:12px;font-weight:600}
/* Login */
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.login .brand{font-size:32px;text-align:center}
.login p{color:var(--muted);text-align:center;margin:0}
.login input{font:600 16px var(--body);padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-align:center}
.err{color:var(--bad);font-size:14px;text-align:center;margin:0}
/* Resumen */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.sum button{background:var(--surface);border:1.5px solid transparent;border-radius:16px;padding:12px 8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.sum button[aria-pressed="true"]{border-color:var(--accent)}
.sum b{font-family:var(--display);font-weight:900;font-size:24px;line-height:1}
.sum small{font-size:11.5px;color:var(--muted);line-height:1.25}
.sum .g b{color:var(--ok)} .sum .r b{color:var(--bad)} .sum .n b{color:var(--muted)}
.blk{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 8px}
/* Lista de clientes */
.cl{display:flex;flex-direction:column;gap:8px}
.ci{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:0;border-radius:16px;padding:13px 14px;text-align:left;width:100%}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.g{background:var(--ok)} .dot.a{background:var(--warn)} .dot.r{background:var(--bad)} .dot.n{background:transparent;border:2px solid var(--muted)}
.ci-n{font-weight:700;font-size:16px}
.ci-m{font-size:13px;color:var(--muted)}
.ci-code{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:7px;background:var(--surface-2);color:var(--accent);font-size:12.5px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;vertical-align:1px}
.ci-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ci-r b{font-size:15px}
.ci-r small{font-size:12px;color:var(--muted)}
.wkb{display:inline-flex;gap:3px}
.wkb i{width:8px;height:8px;border-radius:2px;background:var(--surface-2)}
.wkb i.on{background:var(--accent)}
/* Cliente */
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600}
.ch{display:flex;flex-direction:column;gap:4px;margin:6px 0 12px}
.ch h2{font-family:var(--display);font-weight:900;font-size:28px;text-transform:uppercase;line-height:1.05}
.ch p{margin:0;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--surface);border-radius:14px;padding:10px}
.st small{display:block;font-size:11.5px;color:var(--muted)}
.st b{font-size:17px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--surface);border-radius:14px;padding:4px;margin:14px 0 10px}
.tabs button{border:0;background:none;border-radius:10px;padding:9px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface-2);color:var(--fg)}
.si{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--surface);border:0;border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.si b{font-size:15px}
.si .d{font-size:12.5px;color:var(--muted)}
.si .r{text-align:right;font-size:13px;color:var(--muted)}
.si .r b{display:block;color:var(--fg);font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}
.tag.a{background:rgba(250,204,21,.15);color:var(--warn)}
.tag.r{background:rgba(248,113,113,.15);color:var(--bad)}
.tag.g{background:rgba(74,222,128,.14);color:var(--ok)}
.empty{color:var(--muted);text-align:center;padding:24px 8px;background:var(--surface);border-radius:14px}
/* Progreso */
.pg{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pg-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:none;border:0;padding:0;text-align:left;width:100%}
.pg-h b{font-size:15px}
.pg-h small{display:block;font-size:12.5px;color:var(--muted)}
.pg-v{text-align:right;white-space:nowrap}
.pg-v b{display:block;font-size:16px}
.up{color:var(--ok)} .down{color:var(--bad)} .same{color:var(--muted)}
.spark{width:100%;height:46px;display:block}
.pg-l{margin:4px 0 0;padding:0;list-style:none;font-size:13px;display:flex;flex-direction:column;gap:3px}
.pg-l li{display:flex;justify-content:space-between;color:var(--muted)}
.pg-l li b{color:var(--fg);font-weight:600}
/* Sesión */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0))}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.sh-h h3{font-family:var(--display);font-weight:900;font-size:20px;text-transform:uppercase;line-height:1.1}
.sh-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ex{background:var(--surface);border-radius:14px;padding:12px;margin-bottom:8px}
.ex h4{margin:0 0 6px;font-size:15px}
.ex table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.ex th{font-size:11px;color:var(--muted);font-weight:600;text-align:right;padding:3px 4px;text-transform:uppercase}
.ex th:first-child,.ex td:first-child{text-align:left}
.ex td{padding:5px 4px;text-align:right;border-top:1px solid var(--line)}
.ex tr.no td{color:var(--muted);opacity:.6}
.tp{font-size:12px;font-weight:700}
.tp.t-top{color:var(--accent)} .tp.t-bo{color:#8fb0ff} .tp.t-bo2{color:#c3b5ff} .tp.t-aprox{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.load{color:var(--muted);text-align:center;padding:40px 0}
/* Rutinas */
.fl{display:flex;flex-direction:column;gap:5px;margin:8px 0}
.fl span{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.fl input,.fl select,.fl textarea,.inp,.srow input,.srow select{font:500 16px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.fl textarea{resize:vertical;line-height:1.35}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tg{display:flex;align-items:center;gap:10px;font-size:14.5px;margin:10px 0}
.tg input{width:20px;height:20px;accent-color:var(--accent)}
.savebtn{border:0;border-radius:12px;background:var(--accent);color:#1a1205;font-weight:800;padding:9px 16px}
.savebtn:disabled{background:var(--surface-2);color:var(--muted)}
.ed-head{margin-bottom:8px}
.days-bar{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:16px;padding:12px;margin:4px 0 4px}
.days-bar span{font-size:13px;color:var(--muted)}
.days-bar a{color:var(--fg);font-weight:600;text-decoration:none}
.btn.sm{padding:11px;font-size:15px}
.day{scroll-margin-top:70px}
.day{background:var(--surface);border-radius:18px;padding:12px;margin-top:12px}
.day-h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.day-l{flex:1;min-width:0;font:800 17px var(--display);color:var(--fg);background:none;border:0;border-bottom:1px dashed var(--line);padding:6px 2px;text-transform:uppercase}
.exl{display:flex;flex-direction:column;gap:6px}
.exr{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:stretch}
.exb{background:var(--surface-2);border:0;border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.exn{font-weight:700;font-size:15px}
.exs{font-size:12.5px;color:var(--muted)}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button,.mini{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}
.mv button{flex:1;padding:0 12px}
.mv button:disabled,.mini:disabled{opacity:.3}
.mini.acc{border-color:var(--accent);color:var(--accent)}
.add{width:100%;margin-top:8px;background:none;border:1px dashed rgba(255,138,61,.5);color:var(--accent);border-radius:12px;padding:10px;font-weight:700}
.rec{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:0}
.rec.top{background:#3ddc84} .rec.topbo{background:var(--accent)}
.srow{display:grid;grid-template-columns:1.1fr 1.3fr .8fr auto;gap:6px;margin-bottom:6px;align-items:center}
.srow input,.srow select{padding:9px 8px;font-size:15px}
.qk{display:flex;gap:6px;margin:2px 0 6px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;font-size:14px;text-decoration:underline}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:10px 12px}
.opt > span:last-child{display:flex;gap:6px;flex-shrink:0}
.danger{width:100%;background:none;border:0;color:var(--bad);font-weight:700;padding:14px;margin-top:4px}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{background:var(--surface);border:0;border-radius:12px;padding:14px;text-align:left;font-weight:600}
.menu button:disabled{opacity:.35}
.menu .danger{text-align:left;color:var(--bad);margin:0;background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chip{flex-shrink:0;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:#1a1205;border-color:var(--accent)}
.li{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:12px;padding:11px 12px;margin-bottom:6px}
.li small{color:var(--muted);font-size:12.5px}
.ov{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.ov li span small{color:var(--muted)}
.ov li > small{display:block;color:var(--muted);font-size:12.5px}
.code{font:900 40px var(--display);letter-spacing:.08em;text-align:center;color:var(--accent);margin:10px 0 16px}
/* Cobros */
.sum4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.sum4 button,.sum4 div{background:var(--surface);border:1.5px solid transparent;border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.sum4 button[aria-pressed="true"]{border-color:var(--accent)}
.sum4 b{font-family:var(--display);font-weight:900;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.sum4 small{font-size:12px;color:var(--muted)}
.sum4 .hot b{color:var(--accent)} .sum4 .r b{color:var(--bad)} .sum4 .a b{color:var(--warn)}
.sum4 .money{background:var(--accent);color:#1a1205} .sum4 .money small{color:#1a1205;opacity:.75}
.cb{background:var(--surface);border-radius:16px;padding:13px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;border-left:4px solid var(--sev,var(--surface-2))}
.cb.s-bad{--sev:var(--bad)} .cb.s-warn{--sev:var(--accent)} .cb.s-pend{--sev:var(--warn)} .cb.s-ok{--sev:var(--ok)} .cb.s-off{opacity:.6}
.cb-n{font-weight:700;font-size:16px}
.cb-m{font-size:13px;color:var(--muted)}
.cb-m b{color:var(--fg);font-weight:600}
.cb-a{text-align:right;font-weight:800;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cb-a small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.cb-x{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.cb-x button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:14px;background:var(--surface-2)}
.cb-x .pri{background:var(--accent);color:#1a1205}
.cb-x .lt{background:var(--fg);color:#111}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;border-bottom:1px solid var(--line);padding:7px 0;font-variant-numeric:tabular-nums}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border-radius:12px;padding:4px}
.pl button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;color:var(--muted)}
.pl button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--fg);color:#111;font-weight:700;padding:11px 16px;border-radius:12px;z-index:50;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* Panel de entrenador de Cristian: lee las sesiones que las apps Crisxlift y CristianEntrenador
   ya copian a su hoja de Google. Solo entra con la clave de entrenador (la comprueba la hoja). */
const API = "https://script.google.com/macros/s/AKfycbwiiqxwd2ORCzOD5aSvdamxt6IWDzKbkrktzblpq2RgUkL6HIbrH8qUGug8kbK4cIFY/exec";
const APPS = [{ id: "CristianEntrenador", label: "CristianEntrenador" }, { id: "Crisxlift", label: "Crisxlift" }];
const TYPE = { aprox: "Aprox.", top: "Top set", bo: "Back-off", bo2: "Back-off 2" };
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = n => (+n).toLocaleString("es-ES", { maximumFractionDigits: 1 });
const num = v => parseFloat(String(v ?? "").replace(",", ".")) || 0;
const has = v => v != null && String(v).trim() !== "";
const startOf = d => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
const dayKey = d => { const x = new Date(d); return `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`; };
const daysAgo = ts => Math.round((startOf(Date.now()) - startOf(ts)) / 864e5);
const agoTxt = d => d === 0 ? "hoy" : d === 1 ? "ayer" : `hace ${d} días`;
const dShort = ts => new Date(ts).toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" }).replace(/\./g, "");
const hhmm = ts => new Date(ts).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });

let key = store.get("cp-key"), appId = store.get("cp-app") || "CristianEntrenador";
let view = store.get("cp-view") === "cobros" ? "cobros" : "apps";   /* "apps" = actividad de clientes · "cobros" = cobros y renovaciones */
let cq = "";
let data = null, filter = "all", sel = null, ctab = "ses", openEx = null, loading = false;

async function api(body){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), signal: ctl.signal });
    return await r.json();
  } finally { clearTimeout(t); }
}

/* ---------- Entrar con la clave ---------- */
function renderLogin(msg){
  app.innerHTML = `<section class="login">
    <div class="brand">Panel <span>Cris</span></div>
    <p>Solo para el entrenador. Pon tu clave una vez y queda guardada en este móvil.</p>
    <input id="k" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="Clave de entrenador">
    ${msg ? `<p class="err">${esc(msg)}</p>` : ""}
    <button class="btn" id="go">Entrar</button>
  </section>`;
  const k = document.getElementById("k"), go = document.getElementById("go");
  k.focus();
  k.onkeydown = e => { if (e.key === "Enter") go.click(); };
  go.onclick = async () => {
    const v = k.value.trim(); if (!v) return;
    go.disabled = true; go.textContent = "Comprobando…";
    try {
      const r = await api({ action: "panel", key: v, app: appId });
      if (r && r.ok){ key = v; store.set("cp-key", v); setData(r); if (view === "cobros") loadCobros(false); else render(); }
      else renderLogin(r && r.error === "clave" ? "Esa clave no es correcta." : "No se pudo entrar. Revisa que la hoja tenga la parte del panel.");
    } catch(e){ renderLogin("Sin conexión. Prueba de nuevo."); }
  };
}

/* ---------- Datos ---------- */
function setData(r){ data = r; store.set("cp-data-" + r.app, r); }
async function load(force){
  const cached = store.get("cp-data-" + appId);
  if (cached && !force){ data = cached; render(); }
  else { data = null; render(); }
  loading = true; paintUpd();
  try {
    const r = await api({ action: "panel", key, app: appId });
    if (r && r.ok){ setData(r); loading = false; render(); return; }
    if (r && r.error === "clave"){ store.del("cp-key"); key = null; renderLogin("La clave cambió. Ponla de nuevo."); return; }
  } catch(e){}
  loading = false; paintUpd(true);
}
function paintUpd(fail){
  const u = document.getElementById("upd"); if (!u) return;
  if (view === "cobros") return paintUpdCobros(fail);
  u.textContent = loading ? "Actualizando…" : fail ? "Sin conexión: mostrando lo último guardado" : data ? `Actualizado ${agoTxt(daysAgo(data.at))} a las ${hhmm(data.at)}` : "";
}

/* Volumen efectivo y series de una sesión */
function sesStats(s){
  let all = 0, done = 0, vol = 0;
  (s.exercises || []).forEach(ex => (ex.sets || []).forEach(v => {
    all++; if (!v.done) return; done++;
    if (v.type !== "aprox") vol += num(v.kg) * (parseInt(v.reps) || 0) + num(v.kgL) * (parseInt(v.repsL) || 0);
  }));
  return { all, done, vol };
}
/* Resumen de cada cliente */
function clientRows(){
  const mon = new Date(); mon.setHours(0,0,0,0); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  return data.clients.map(c => {
    const ses = data.sessions.filter(s => s.code === c.code).sort((a,b) => b.ts - a.ts);
    const last = ses[0], since = last ? daysAgo(last.ts) : null;
    const wk = new Set(ses.filter(s => s.ts >= mon.getTime()).map(s => dayKey(s.ts))).size;
    const st = since === null ? "n" : since <= 3 ? "g" : since <= 6 ? "a" : "r";
    return { ...c, ses, last, since, wk, st };
  });
}

/* ---------- Pantalla principal: actividad ---------- */
function render(){
  if (!key) return renderLogin();
  if (ed) return renderEditor();
  if (view === "cobros") return renderCobros();
  if (sel) return renderClient();
  const head = topHTML();
  if (!data){ app.innerHTML = head + `<div class="load">Cargando clientes…</div>`; wireTop(); paintUpd(); return; }
  const rows = clientRows();
  const n = { g: rows.filter(r => r.wk > 0).length, r: rows.filter(r => r.st === "r").length, n: rows.filter(r => r.st === "n").length };
  const order = { r: 0, n: 1, a: 2, g: 3 };
  const list = rows.filter(r => filter === "all" || (filter === "wk" ? r.wk > 0 : r.st === filter))
    .sort((a,b) => order[a.st] - order[b.st] || (b.since ?? 0) - (a.since ?? 0) || a.name.localeCompare(b.name));
  const chip = (f, cls, val, txt) => `<button class="${cls}" data-f="${f}" aria-pressed="${filter === f}"><b>${val}</b><small>${txt}</small></button>`;
  app.innerHTML = head + `
    <div class="sum">
      ${chip("wk", "g", `${n.g}/${rows.length}`, "entrenaron esta semana")}
      ${chip("r", "r", n.r, "7+ días sin entrenar")}
      ${chip("n", "n", n.n, "sin empezar")}
    </div>
    <input id="buscar" class="inp" type="search" placeholder="🔍 Buscar cliente…" autocomplete="off" value="${esc(cq)}" style="margin-bottom:8px">
    <button class="ghost" id="nuevo" style="margin-bottom:6px">＋ Nuevo cliente en ${esc(APPS.find(a => a.id === appId).label)}</button>
    <div class="blk">${filter === "all" ? "Todos los clientes" : `Filtrando · <button class="back" id="all" style="padding:0;font-size:12px;letter-spacing:0;text-transform:none;text-decoration:underline">ver todos</button>`}</div>
    <div class="cl">${list.map(r => `<button class="ci" data-c="${esc(r.code)}" data-q="${esc(norm(r.name + " " + r.code))}">
      <span class="dot ${r.st}"></span>
      <span><span class="ci-n">${esc(r.name)}</span><span class="ci-code">${esc(r.code)}</span><br><span class="ci-m">${r.last ? `${esc(r.last.dayLabel || "")} · ${agoTxt(r.since)}` : "Aún no ha registrado ningún entreno"}</span></span>
      <span class="ci-r"><span class="wkb" aria-label="${r.wk} de ${r.days} esta semana">${Array.from({ length: Math.max(r.days, r.wk) }, (_, i) => `<i class="${i < r.wk ? "on" : ""}"></i>`).join("")}</span><small>${r.wk}/${r.days} semana</small></span>
    </button>`).join("") || `<div class="empty">Nadie en este grupo 🙌</div>`}</div>`;
  wireTop(); paintUpd();
  app.querySelectorAll(".sum button").forEach(b => b.onclick = () => { filter = filter === b.dataset.f ? "all" : b.dataset.f; render(); });
  const all = document.getElementById("all"); if (all) all.onclick = () => { filter = "all"; render(); };
  document.getElementById("nuevo").onclick = () => newClientForm();
  /* Buscar cliente: filtra la lista mientras escribes (por nombre o código) */
  const bus = document.getElementById("buscar");
  const filtra = () => {
    cq = bus.value; const t = norm(cq.trim()); let vis = 0;
    app.querySelectorAll(".ci").forEach(b => { const ok = !t || b.dataset.q.includes(t); b.hidden = !ok; if (ok) vis++; });
    let e = document.getElementById("sinres");
    if (!vis && t){ if (!e){ e = document.createElement("div"); e.id = "sinres"; e.className = "empty"; app.querySelector(".cl").appendChild(e); } e.textContent = "Ningún cliente con ese nombre"; }
    else if (e) e.remove();
  };
  bus.oninput = filtra; if (cq) filtra();
  app.querySelectorAll(".ci").forEach(b => b.onclick = () => { sel = b.dataset.c; ctab = "ses"; openEx = null; render(); window.scrollTo(0,0); });
}
function topHTML(){
  return `<header class="top">
    <div class="top-row"><div class="brand">Panel <span>Cris</span></div><button class="icon-b" id="ref">↻ Actualizar</button></div>
    <div class="seg" role="group" aria-label="Sección">${APPS.map(a => `<button data-a="${a.id}" aria-pressed="${view === "apps" && a.id === appId}">${a.label}</button>`).join("")}<button data-a="cobros" aria-pressed="${view === "cobros"}">💶 Cobros</button></div>
    <div class="upd" id="upd"></div>
  </header>`;
}
function wireTop(){
  const ref = document.getElementById("ref"); if (ref) ref.onclick = () => view === "cobros" ? loadCobros(true) : load(true);
  app.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    if (b.dataset.a === "cobros"){
      if (view === "cobros") return;
      view = "cobros"; store.set("cp-view", view); sel = null; loadCobros(false); return;
    }
    if (view === "apps" && b.dataset.a === appId) return;
    const was = view; view = "apps"; store.set("cp-view", view);
    if (was === "apps" || b.dataset.a !== appId){ appId = b.dataset.a; store.set("cp-app", appId); filter = "all"; sel = null; load(false); }
    else { sel = null; data ? render() : load(false); }
  });
}

function sessionsHTML(r){
  if (!r.ses.length) return `<div class="empty">Todavía no hay entrenos guardados.</div>`;
  return `<div class="cl">${r.ses.map((s, i) => { const x = sesStats(s), pct = x.all ? x.done / x.all : 0;

      <span class="r"><b>${x.done}/${x.all}</b>series</span>
      <span class="d">${esc(dShort(s.ts))} · ${hhmm(s.ts)}</span>
      <span class="r">${fmt(Math.round(x.vol))} kg</span>
    </button>`; }).join("")}</div>`;
}

/* Top set de cada ejercicio en cada sesión (el primero marcado como top set) */
function topOf(ex){
  const t = (ex.sets || []).find(v => v.type === "top" && !v.extra && (has(v.kg) || has(v.reps) || has(v.kgL)));
  if (!t) return null;
  const uni = has(t.kgL) || has(t.repsL);
  const kg = uni ? Math.max(num(t.kg), num(t.kgL)) : num(t.kg);
  const reps = uni ? Math.max(parseInt(t.reps) || 0, parseInt(t.repsL) || 0) : (parseInt(t.reps) || 0);
  return { kg, reps, rpe: t.rpe, uni, txt: uni ? `D ${has(t.kg) ? fmt(num(t.kg)) : "—"}×${t.reps || "—"} · I ${has(t.kgL) ? fmt(num(t.kgL)) : "—"}×${t.repsL || "—"}` : kg ? `${fmt(kg)}×${reps}` : `${reps} reps` };
}
function cmp(a, b){
  if (!a || !b) return null;
  if (b.kg !== a.kg) return { cls: b.kg > a.kg ? "up" : "down", txt: `${b.kg > a.kg ? "+" : ""}${fmt(b.kg - a.kg)} kg` };
  if (b.reps !== a.reps) return { cls: b.reps > a.reps ? "up" : "down", txt: `${b.reps > a.reps ? "+" : ""}${b.reps - a.reps} rep${Math.abs(b.reps - a.reps) === 1 ? "" : "s"}` };
  return { cls: "same", txt: "igual" };
}
function spark(pts){
  if (pts.length < 2) return "";
  const useKg = pts.some(p => p.kg > 0), vals = pts.map(p => useKg ? p.kg : p.reps);
  const min = Math.min(...vals), max = Math.max(...vals), W = 300, H = 46, pad = 5;
  const x = i => pad + i * (W - 2 * pad) / (pts.length - 1), y = v => max === min ? H / 2 : H - pad - (v - min) * (H - 2 * pad) / (max - min);
  const d = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="#ff8a3d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${vals.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="#ff8a3d"/>`).join("")}</svg>`;
}
function progressHTML(r){
  const by = {};
  [...r.ses].sort((a,b) => a.ts - b.ts).forEach(s => (s.exercises || []).forEach(ex => {
    const t = topOf(ex); if (!t) return;
    (by[ex.name] = by[ex.name] || []).push({ ...t, ts: s.ts });
  }));
  const names = Object.keys(by).sort((a,b) => by[b][by[b].length - 1].ts - by[a][by[a].length - 1].ts);
  if (!names.length) return `<div class="empty">Cuando haya top sets registrados, aquí verás cómo evolucionan.</div>`;
  return `<p class="note" style="margin:0 0 10px">Top set de cada ejercicio, sesión a sesión. Toca uno para ver el detalle.</p><div class="cl">${names.map(nm => {
    const p = by[nm], last = p[p.length - 1], prev = p[p.length - 2], c = cmp(prev, last), tot = cmp(p[0], last);
    const stuck = p.length >= 3 && p.slice(-3).every(q => q.kg === last.kg && q.reps <= p[p.length - 3].reps);
    return `<div class="pg"><button class="pg-h" data-n="${esc(nm)}">
        <span><b>${esc(nm)}</b>${stuck ? `<span class="tag r">sin cambios 3 sesiones</span>` : ""}<small>${p.length} ${p.length === 1 ? "sesión" : "sesiones"}${p.length > 1 && tot ? ` · desde el inicio <span class="${tot.cls}">${tot.txt}</span>` : ""}</small></span>
        <span class="pg-v"><b>${esc(last.txt)}</b>${c ? `<small class="${c.cls}">${c.txt} vs. anterior</small>` : `<small class="same">primera vez</small>`}</span>
      </button>
      ${spark(p)}
      ${openEx === nm ? `<ul class="pg-l">${[...p].reverse().map(q => `<li><span>${esc(dShort(q.ts))}</span><b>${esc(q.txt)}${q.rpe != null && q.rpe !== "" ? ` · RPE ${esc(q.rpe)}` : ""}</b></li>`).join("")}</ul>` : ""}
    </div>`; }).join("")}</div>`;
}

/* ---------- Detalle de una sesión ---------- */
function openSession(r, s){
  const x = sesStats(s);
  const sh = document.createElement("div"); sh.className = "sheet";
  sh.innerHTML = `<div class="sheet-in" role="dialog" aria-label="Sesión">
    <div class="sh-h"><div><h3>${esc(s.dayLabel || "Entreno")}</h3><p>${esc(r.name)} · ${esc(dShort(s.ts))} · ${hhmm(s.ts)}</p><p>${x.done}/${x.all} series · ${fmt(Math.round(x.vol))} kg efectivos${s.warm ? " · calentamiento ✓" : ""}${s.cool ? " · cardio ✓" : ""}</p></div><button class="icon-b" id="cl">Cerrar</button></div>
    ${(s.exercises || []).map(ex => { const uni = (ex.sets || []).some(v => has(v.kgL) || has(v.repsL)); const c = {};
      return `<div class="ex"><h4>${esc(ex.name)}</h4><table><thead><tr><th>Serie</th><th>Kg</th><th>Reps</th><th>RPE</th><th>RIR obj.</th></tr></thead><tbody>${(ex.sets || []).map(v => {
        c[v.type] = (c[v.type] || 0) + 1;
        const lab = TYPE[v.type] || v.type;
        const kg = uni ? `D ${has(v.kg) ? fmt(num(v.kg)) : "—"} / I ${has(v.kgL) ? fmt(num(v.kgL)) : "—"}` : has(v.kg) ? fmt(num(v.kg)) : "—";
        const reps = uni ? `${v.reps || "—"} / ${v.repsL || "—"}` : (has(v.reps) ? esc(v.reps) : "—");
        return `<tr class="${v.done ? "" : "no"}"><td><span class="tp t-${esc(v.type)}">${esc(lab)}</span></td><td>${kg}</td><td>${reps}</td><td>${v.rpe != null && v.rpe !== "" ? esc(v.rpe) : "—"}</td><td>${v.tRir != null && v.tRir !== "" ? esc(v.tRir) : "—"}</td></tr>`;
      }).join("")}</tbody></table>${ex.note ? `<p class="note">📝 ${esc(ex.note)}</p>` : ""}</div>`; }).join("")}
    <p class="note" style="text-align:center">Las series en gris no se marcaron como hechas.</p>
  </div>`;
  document.body.appendChild(sh);
  const close = () => sh.remove();
  sh.querySelector("#cl").onclick = close;
  sh.addEventListener("click", e => { if (e.target === sh) close(); });
}

/* =====================================================================
   RUTINAS: ver, modificar y crear clientes nuevos
   La rutina vive en la hoja (pestaña Rutinas). Al guardar, la versión anterior
   queda en la pestaña "Historial rutinas". El cliente la recibe al abrir su app.
   ===================================================================== */
const GYMS = ["VivaGym", "FitnessPark", "Otro gimnasio", "Casa"];
const STYPE = { top: "Top set", bo: "Back-off", bo2: "Back-off 2", ok: "Hecho" };
const SSHORT = { top: "Top", bo: "BO", bo2: "BO2", ok: "✓" };
const RECS = [["", "No grabar"], ["top", "Grabar top set (verde)"], ["topbo", "Grabar top set y back-off (naranja)"]];
const RIRS = ["0", "1", "2", "+2"];
let ed = null;                       /* { code, app, name, client, ver, isNew, dirty } */
let lib = store.get("cp-lib");       /* biblioteca de ejercicios (solo panel) */
const routCache = {};
const clone = o => JSON.parse(JSON.stringify(o));
const $ = id => document.getElementById(id);
const defGym = a => a === "CristianEntrenador" ? "VivaGym" : "Otro gimnasio";
const ytId = u => { u = String(u || "").trim(); const m = u.match(/(?:shorts\/|[?&]v=|youtu\.be\/|embed\/)([\w-]{6,})/); return m ? m[1] : (/^[\w-]{8,15}$/.test(u) ? u : ""); };
const norm = t => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const VIVA_SPOT = /\((al lado|zona de|maquina al lado|cerca de)/;

function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
/* Hoja inferior apilable (se puede abrir una encima de otra) */
function sheet(html){
  const sh = document.createElement("div"); sh.className = "sheet";
  sh.innerHTML = `<div class="sheet-in" role="dialog">${html}</div>`;
  document.body.appendChild(sh);
  sh.close = () => sh.remove();
  sh.addEventListener("click", e => { if (e.target === sh && !sh.sticky) sh.close(); });
  return sh;
}

/* ---------- Biblioteca ---------- */
async function loadLib(force){
  if (lib && !force) return lib;
  const r = await api({ action: "panelLib", key });
  if (r && r.ok){ lib = r.lib; store.set("cp-lib", lib); return lib; }
  if (r && r.error === "accion") throw new Error("script");
  throw new Error("lib");
}
const libFind = n => (lib || []).find(it => norm(it.n) === norm(n));
function gymOk(it, gym){
  if (it.gym){
    const g = norm(gym);
    return norm(it.gym).split(/[,;/]/).map(x => x.trim()).some(x => x && (x === "todos" || g.indexOf(x) === 0));
  }
  if (gym === "VivaGym") return true;
  if (VIVA_SPOT.test(norm(it.n))) return false;          /* sitios concretos de VivaGym */
  if (gym === "Casa") return /casa|peso corporal|banda|colchoneta|mancuerna/i.test(it.m);
  return true;
}
/* Ejercicio de la biblioteca → formato de la app */
function fromLib(it, ctx){
  const ex = { name: it.n, rir: "2", cues: [], sets: [{ type: "top", target: "10 reps" }, { type: "bo", target: "10 reps" }] };
  const v = ytId(it.v); if (v) ex.video = v;
  if (ctx.gym === "VivaGym" && it.f) ex.img = it.f;
  const no = it.no || "";
  if (/por tiempo/i.test(no)){ ex.check = true; delete ex.rir; ex.sets = [{ type: "ok", target: "30 segundos" }]; }
  if (/^unilateral/i.test(no)){ ex.uni = true; ex.limb = /cuadr|isquio|glute|gemel|aduct|abduct|pierna/.test(norm(it.g + " " + no)) ? "Pierna" : "Brazo"; }
  const setup = no.split(/\.\s+/).map(s => s.trim().replace(/\.$/, ""))
    .filter(s => s && !/^(unilateral|por tiempo|sin kg|sin peso|variante|plan b|reps por pierna|maquina con o sin)/.test(norm(s))).join(". ");
  if (setup) ex.setup = setup;
  if (/^sentadilla bulgara con mancuernas/.test(norm(it.n)) && !/letizia/.test(norm(ctx.name))){
    const m = "el peso siempre será el de una sola mancuerna a pesar de ser dos";
    if (ctx.app === "CristianEntrenador") ex.memo = [m]; else ex.cues = [m];
  }
  /* En VivaGym (CristianEntrenador) va con su opción B habitual */
  if (ctx.app === "CristianEntrenador" && it.b){
    const b = libFind(it.b);
    if (b && gymOk(b, ctx.gym)) ex.alt = altFrom(b, ex, ctx);
  }
  return ex;
}
function altFrom(it, ex, ctx){
  const o = { name: it.n };
  if (ctx.gym === "VivaGym" && it.f) o.img = it.f;
  const v = ytId(it.v); if (v && v !== ex.video) o.video = v;
  o.sets = ex.sets.map(s => ({ type: s.type, target: s.target }));
  return o;
}
/* La opción B/C copia las series de la A (conserva lo que hizo la semana pasada si estaba) */
function syncAlts(ex){
  ["alt", "alt2"].forEach(k => {
    const o = ex[k]; if (!o) return;
    const old = o.sets || [];
    o.sets = ex.sets.map((s, i) => { const n = { type: s.type, target: s.target }; if (s.rir != null) n.rir = s.rir; if (old[i] && old[i].prev && old[i].type === s.type) n.prev = old[i].prev; return n; });
  });
}
const setsTxt = ex => (ex.sets || []).map(s => `${SSHORT[s.type] || s.type} ${String(s.target || "").replace(/\s*reps?$/i, "")}`).join(" · ");

/* ---------- Pestaña "Rutina" de la ficha ---------- */
async function getRoutine(code, force){
  if (routCache[code] && !force) return routCache[code];
  const r = await api({ action: "panelRoutine", key, app: appId, code });
  if (r && r.ok){ routCache[code] = r; return r; }
  if (r && r.error === "clave"){ store.del("cp-key"); key = null; renderLogin("La clave cambió. Ponla de nuevo."); return null; }
  throw new Error(r && r.error === "accion" ? "script" : "api");
}
async function routineTab(r, body){
  body.innerHTML = `<div class="load">Cargando rutina…</div>`;
  let res;
  try { res = await getRoutine(r.code, true); } catch(e){
    body.innerHTML = `<div class="empty">${e.message === "script" ? "Falta actualizar el código de la hoja (Apps Script) para poder editar rutinas." : "No se pudo cargar la rutina. Revisa la conexión."}</div>`; return;
  }
  if (!res || sel !== r.code || ctab !== "rut") return;
  const c = res.client;
  body.innerHTML = `<button class="btn" id="edit">✏️ Modificar rutina</button>
    <p class="note" style="margin:8px 0 12px">${esc(c.gym || defGym(appId))}${c.block ? ` · ${esc(c.block)}` : ""}</p>
    <div class="cl">${c.days.map(d => `<div class="pg"><b>${esc(d.label)}</b>
      <ol class="ov">${d.exercises.map(ex => `<li><span>${esc(ex.name)}${ex.alt ? `<small> · B: ${esc(ex.alt.name)}</small>` : ""}</span><small>${esc(setsTxt(ex))}</small></li>`).join("")}</ol></div>`).join("")}</div>`;
  $("edit").onclick = () => { ed = { code: r.code, app: appId, name: res.name, client: clone(c), ver: res.ver, dirty: false }; render(); window.scrollTo(0,0); };
}

/* ---------- Cliente nuevo ---------- */
function newClientForm(){
  const rows = data ? data.clients : [];
  const sh = sheet(`<div class="sh-h"><div><h3>Nuevo cliente</h3><p>${esc(appId)}</p></div><button class="icon-b" data-x>Cerrar</button></div>
    <label class="fl"><span>Nombre (como lo verá en la app)</span><input id="nn" autocomplete="off" placeholder="Ej.: Laura"></label>

  sh.querySelector("[data-x]").onclick = sh.close;
  $("nn").focus();
  $("ngo").onclick = async () => {
    const name = $("nn").value.trim(), gym = $("ng").value, base = $("nb").value, err = $("ne");
    if (!name){ err.hidden = false; err.textContent = "Pon el nombre."; return; }
    let client = { name, block: "Semana 1", seedVer: 1, fresh: true, gym, days: [{ id: "D1", label: "Día 1", exercises: [] }] };
    if (appId === "Crisxlift") client.weekly = [];
    if (base){
      $("ngo").disabled = true; $("ngo").textContent = "Copiando…";
      try {
        const src = clone((await getRoutine(base)).client);
        ["lastWeek", "histFix", "setupFix", "creatina", "weekly"].forEach(k => delete src[k]);
        src.days.forEach(d => { delete d.lastWeek; d.exercises.forEach(ex => [ex, ex.alt, ex.alt2].forEach(o => o && (o.sets || []).forEach(s => delete s.prev))); });
        client = Object.assign(src, { name, block: "Semana 1", seedVer: 1, fresh: true, gym });
        if (appId === "Crisxlift") client.weekly = [];
      } catch(e){ err.hidden = false; err.textContent = "No se pudo copiar esa rutina."; $("ngo").disabled = false; $("ngo").textContent = "Seguir → armar la rutina"; return; }
    }
    sh.close();
    ed = { code: null, app: appId, name, client, isNew: true, dirty: true };
    render(); window.scrollTo(0,0);
  };
}

/* ---------- Editor de rutina ---------- */

      <button class="back" id="edx">‹ ${ed.isNew ? "Cancelar" : "Volver"}</button>

      </div>
      ${ed.app === "CristianEntrenador" ? `<label class="tg"><input type="checkbox" id="edc" ${c.creatina ? "checked" : ""}> Check-in de creatina en el inicio</label>` : ""}

      <button class="btn sm" data-newday>＋ Añadir nueva sesión</button></div>
    ${c.days.map((d, di) => `<section class="day" id="day-${di}">
      <div class="day-h"><input class="day-l" data-d="${di}" value="${esc(d.label)}" aria-label="Nombre del día"><button class="icon-b" data-dm="${di}" aria-label="Opciones del día">⋯</button></div>

      <div class="exl">${d.exercises.map((ex, ei) => `<div class="exr">
        <button class="exb" data-d="${di}" data-e="${ei}"><span class="exn">${ei + 1}. ${esc(ex.name)}</span>
          <span class="exs">${esc(setsTxt(ex))}${ex.rir != null && !ex.check ? ` · RIR ${esc(ex.rir)}` : ""}${ex.rec ? ` · <i class="rec ${esc(ex.rec)}"></i>` : ""}</span>
          ${ex.alt ? `<span class="exs">B: ${esc(ex.alt.name)}${ex.alt2 ? ` · C: ${esc(ex.alt2.name)}` : ""}</span>` : ""}</button>
        <div class="mv"><button data-mv="-1" data-d="${di}" data-e="${ei}" ${ei ? "" : "disabled"} aria-label="Subir">↑</button><button data-mv="1" data-d="${di}" data-e="${ei}" ${ei < d.exercises.length - 1 ? "" : "disabled"} aria-label="Bajar">↓</button></div>
      </div>`).join("") || `<p class="note" style="margin:4px 0 8px">Todavía sin ejercicios.</p>`}</div>
      ${(d.warm || []).length || (d.cool || []).length ? `<p class="note">${(d.warm || []).length ? `Calentamiento: ${d.warm.map(w => esc(w.n)).join(", ")}` : ""}${(d.warm || []).length && (d.cool || []).length ? "<br>" : ""}${(d.cool || []).length ? `${esc(d.coolTitle || "Para terminar")}: ${d.cool.map(w => esc(w.n)).join(", ")}` : ""}</p>` : ""}

    <button class="ghost" data-newday style="margin-top:12px">＋ Añadir nueva sesión (día)</button>

  $("edx").onclick = () => { if (ed.dirty && !confirm(ed.isNew ? "¿Descartar este cliente nuevo?" : "Tienes cambios sin guardar. ¿Salir igualmente?")) return; ed = null; render(); };
  $("eds").onclick = saveEd;
  $("edn").oninput = e => { ed.name = e.target.value; dirty(); };

  $("edg").onchange = e => { c.gym = e.target.value; dirty(); };

  app.querySelectorAll(".day-l").forEach(i => i.oninput = () => { c.days[+i.dataset.d].label = i.value; dirty(); });

/* Nueva sesión: se le pone nombre, se crea vacía y se abre la biblioteca para su primer ejercicio */
function newDay(){
  const c = ed.client, n = c.days.length + 1;
  const sh = sheet(`<div class="sh-h"><div><h3>Nueva sesión</h3><p>Será el día ${n} de ${esc(ed.name)}</p></div><button class="icon-b" data-x>Cerrar</button></div>
    <label class="fl"><span>Nombre de la sesión</span><input id="ndl" autocomplete="off" placeholder="Ej.: Upper A"></label>
    <div class="qk" style="flex-wrap:wrap">${["Upper A", "Upper B", "Legday A", "Legday B", "Full body", "Push", "Pull"].map(t => `<button class="mini" data-t="${t}">${t}</button>`).join("")}</div>
    <button class="btn" id="ndok" style="margin-top:12px">Crear y añadir ejercicios</button>`);

    const name = inp.value.trim();
    let id; do { id = "D" + Math.random().toString(36).slice(2, 6).toUpperCase(); } while (c.days.some(d => d.id === id));

const ctxEd = () => ({ gym: ed.client.gym || defGym(ed.app), app: ed.app, name: ed.name });

function dayMenu(di){
  const c = ed.client, d = c.days[di];

      ${ed.app === "CristianEntrenador" ? `<button data-a="home">${d.home ? "🏋️ Quitar «día en casa»" : "🏠 Marcar como día en casa (sin aviso de opción B)"}</button>` : ""}

  sh.querySelector("[data-x]").onclick = sh.close;

    if (a === "home"){ if (d.home) delete d.home; else d.home = true; }
    if (a === "del"){ if (c.days.length < 2){ toast("La rutina necesita al menos un día"); return; } if (!confirm(`¿Borrar «${d.label}»?`)) return; c.days.splice(di, 1); }
    if (a === "wc"){ sh.close(); return warmCool(di); }
    sh.close(); dirty(); renderEditor();
  });
}
function warmCool(di){
  const d = ed.client.days[di];
  const txt = arr => (arr || []).map(w => [w.n, w.t, w.url].filter(Boolean).join(" | ")).join("\n");
  const parse = t => t.split("\n").map(l => l.split("|").map(x => x.trim())).filter(p => p[0]).map(([n, t, url]) => { const o = { n }; if (t) o.t = t; if (url) o.url = url; return o; });
  const sh = sheet(`<div class="sh-h"><div><h3>Calentamiento y final</h3><p>${esc(d.label)}</p></div><button class="icon-b" data-x>Cerrar</button></div>
    <p class="note">Uno por línea: <b>nombre | tiempo | enlace</b> (el tiempo y el enlace son opcionales).</p>
    <label class="fl"><span>Calentamiento</span><textarea id="ww" rows="3" placeholder="Movilidad de cadera | 1 min | https://youtube.com/shorts/…">${esc(txt(d.warm))}</textarea></label>
    <label class="fl"><span>Título del final</span><input id="wt" value="${esc(d.coolTitle || "")}" placeholder="Para terminar"></label>
    <label class="fl"><span>Final</span><textarea id="wc" rows="3" placeholder="Cinta con la inclinación al máximo | 10 min">${esc(txt(d.cool))}</textarea></label>
    <button class="btn" id="wok">Listo</button>`);
  sh.querySelector("[data-x]").onclick = sh.close;
  $("wok").onclick = () => {
    const w = parse($("ww").value), cl = parse($("wc").value), t = $("wt").value.trim();
    if (w.length) d.warm = w; else delete d.warm;
    if (cl.length) d.cool = cl; else delete d.cool;
    if (t) d.coolTitle = t; else delete d.coolTitle;
    sh.close(); dirty(); renderEditor();
  };
}

/* ---------- Ficha de un ejercicio ---------- */
function openExercise(di, ei){
  const day = ed.client.days[di], x = clone(day.exercises[ei]), ctx = ctxEd(), CE = ed.app === "CristianEntrenador";
  const sh = sheet(""); sh.sticky = true;
  const box = sh.firstElementChild;
  const libIt = () => libFind(x.name);
  function collect(){
    const q = s => box.querySelector(s);
    x.name = q("#xn").value.trim() || x.name;
    x.sets = [...box.querySelectorAll(".srow")].map(r => {
      const o = { type: r.querySelector("select.st").value, target: r.querySelector("input").value.trim() };
      const rr = r.querySelector("select.sr"); if (rr && rr.value !== "") o.rir = rr.value;
      const old = x.sets[+r.dataset.i]; if (old && old.prev && old.type === o.type) o.prev = old.prev;
      return o;
    });
    if (!x.check){ const v = q("#xr").value; if (v) x.rir = v; else delete x.rir; }
    const rec = q("#xrec").value; if (rec) x.rec = rec; else delete x.rec;
    const su = q("#xsu").value.trim(); if (su) x.setup = su; else delete x.setup;
    x.cues = q("#xcu").value.split("\n").map(s => s.trim()).filter(Boolean);
    if (q("#xme")){ const me = q("#xme").value.split("\n").map(s => s.trim()).filter(Boolean); if (me.length) x.memo = me; else delete x.memo; }
    const vs = q("#xv").value, vo = q("#xvo").value.trim();
    const vid = vs === "__otro" ? ytId(vo) : vs; if (vid) x.video = vid; else if (vs === "") delete x.video;
    if (x.uni){ x.limb = q("#xl").value; }
  }
  function paint(){
    const it = libIt(), vids = [];
    if (it) [it.v, ...(it.va || [])].map(ytId).filter(Boolean).forEach(v => vids.includes(v) || vids.push(v));
    if (x.video && !vids.includes(x.video)) vids.unshift(x.video);
    const sug = it && it.b && !x.alt ? libFind(it.b) : null;
    const optBox = (k, L) => x[k]
      ? `<div class="opt"><span><b>${esc(x[k].name)}</b>${x[k].img ? " 📷" : ""}</span><span><button class="mini" data-op="ch-${k}">Cambiar</button><button class="mini" data-op="rm-${k}">Quitar</button></span></div>`
      : `<div class="opt"><span class="note" style="margin:0">Sin opción ${L}</span><span>${k === "alt" && sug ? `<button class="mini acc" data-op="sug">＋ ${esc(sug.n)}</button>` : ""}<button class="mini" data-op="ch-${k}">＋ Elegir</button></span></div>`;
    box.innerHTML = `<div class="sh-h"><div><h3>${esc(day.label)}</h3><p>Ejercicio ${ei + 1} de ${day.exercises.length}</p></div><button class="icon-b" id="xc">Cancelar</button></div>
      <label class="fl"><span>Nombre</span><input id="xn" value="${esc(x.name)}"></label>
      <button class="link" id="xsw">⇄ Cambiar por otro de la biblioteca</button>
      <div class="blk">Series</div>
      <div id="xs">${x.sets.map((s, i) => `<div class="srow" data-i="${i}">
        <select class="st" aria-label="Tipo">${(x.check ? ["ok"] : ["top", "bo", "bo2"]).map(t => `<option value="${t}" ${t === s.type ? "selected" : ""}>${STYPE[t]}</option>`).join("")}</select>
        <input value="${esc(s.target || "")}" placeholder="${x.check ? "30 segundos" : "8–10 reps"}" aria-label="Objetivo">
        ${x.check ? "" : `<select class="sr" aria-label="RIR de la serie"><option value="">RIR =</option>${RIRS.map(r => `<option ${String(s.rir) === r ? "selected" : ""}>${r}</option>`).join("")}</select>`}
        <button class="mini" data-rm="${i}" aria-label="Quitar serie" ${x.sets.length > 1 ? "" : "disabled"}>✕</button></div>`).join("")}</div>
      ${x.check ? "" : `<div class="qk"><button class="mini" id="xadd">＋ Serie</button><button class="mini" id="xsame">Mismas reps en todas</button></div>`}
      <div class="row2">
        ${x.check ? "<span></span>" : `<label class="fl"><span>RIR del ejercicio</span><select id="xr"><option value="">—</option>${RIRS.map(r => `<option ${String(x.rir) === r ? "selected" : ""}>${r}</option>`).join("")}</select></label>`}
        <label class="fl"><span>Grabación</span><select id="xrec">${RECS.map(([v, t]) => `<option value="${v}" ${(x.rec || "") === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      </div>
      <label class="tg"><input type="checkbox" id="xuni" ${x.uni ? "checked" : ""}> Unilateral (un lado y después el otro)</label>
      ${x.uni ? `<label class="fl"><span>Lado</span><select id="xl">${["Pierna", "Brazo"].map(l => `<option ${(x.limb || "Brazo") === l ? "selected" : ""}>${l}</option>`).join("")}</select></label>` : ""}
      <label class="tg"><input type="checkbox" id="xck" ${x.check ? "checked" : ""}> Por tiempo / solo marcar hecho (sin kg ni reps)</label>
      <label class="fl"><span>Setup / ajuste</span><input id="xsu" value="${esc(x.setup || "")}" placeholder="Ej.: Banco a 30°"></label>
      <label class="fl"><span>Indicaciones (en «Ver ejercicio», una por línea)</span><textarea id="xcu" rows="2">${esc((x.cues || []).join("\n"))}</textarea></label>
      ${CE ? `<label class="fl"><span>Nota bajo el nombre (una por línea)</span><textarea id="xme" rows="2">${esc((x.memo || []).join("\n"))}</textarea></label>` : ""}
      <label class="fl"><span>Vídeo</span><select id="xv"><option value="">Sin vídeo</option>${vids.map((v, i) => `<option value="${esc(v)}" ${v === x.video ? "selected" : ""}>${i === 0 && it && ytId(it.v) === v ? "Vídeo principal" : "Vídeo"} · ${esc(v)}</option>`).join("")}<option value="__otro">Otro enlace…</option></select></label>
      <input id="xvo" class="inp" placeholder="Pega el enlace de YouTube" hidden>
      ${it && it.no ? `<p class="note">📚 Biblioteca: ${esc(it.no)}</p>` : ""}
      <div class="blk">Opción B</div>${optBox("alt", "B")}
      ${x.alt || x.alt2 ? `<div class="blk">Opción C</div>${optBox("alt2", "C")}` : ""}
      <button class="btn" id="xok" style="margin-top:16px">Listo</button>
      <button class="danger" id="xdel">Quitar ejercicio del día</button>`;
    const q = s => box.querySelector(s);
    q("#xc").onclick = sh.close;
    q("#xv").onchange = e => { q("#xvo").hidden = e.target.value !== "__otro"; };
    q("#xsw").onclick = () => { collect(); openPicker(it2 => {
      const n = fromLib(it2, ctx); n.sets = x.sets.map(s => ({ type: n.check ? "ok" : (s.type === "ok" ? "top" : s.type), target: s.target })); if (n.check) n.sets = [{ type: "ok", target: x.check ? x.sets[0].target : "30 segundos" }];
      if (x.rec) n.rec = x.rec; if (x.rir != null && !n.check) n.rir = x.rir;
      if (!n.alt && x.alt) n.alt = x.alt; if (x.alt2) n.alt2 = x.alt2;
      Object.keys(x).forEach(k => delete x[k]); Object.assign(x, n); paint();
    }); };
    box.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { collect(); x.sets.splice(+b.dataset.rm, 1); paint(); });
    if (q("#xadd")) q("#xadd").onclick = () => { collect(); const l = x.sets[x.sets.length - 1]; x.sets.push({ type: x.sets.length >= 2 ? "bo2" : "bo", target: l ? l.target : "10 reps" }); paint(); };
    if (q("#xsame")) q("#xsame").onclick = () => { collect(); const t = x.sets[0] && x.sets[0].target; x.sets.forEach(s => s.target = t); paint(); };
    q("#xuni").onchange = e => { collect(); if (e.target.checked){ x.uni = true; x.limb = x.limb || "Pierna"; } else { delete x.uni; delete x.limb; } paint(); };
    q("#xck").onchange = e => { collect(); if (e.target.checked){ x.check = true; delete x.rir; x.sets = [{ type: "ok", target: "30 segundos" }]; } else { delete x.check; x.rir = "2"; x.sets = [{ type: "top", target: "10 reps" }, { type: "bo", target: "10 reps" }]; } paint(); };
    box.querySelectorAll("[data-op]").forEach(b => b.onclick = () => {
      collect(); const op = b.dataset.op;
      if (op === "sug"){ x.alt = altFrom(libFind(libIt().b), x, ctx); return paint(); }
      const k = op.slice(3);
      if (op.startsWith("rm-")){ delete x[k]; if (k === "alt" && x.alt2){ x.alt = x.alt2; delete x.alt2; } return paint(); }
      openPicker(it2 => { x[k] = altFrom(it2, x, ctx); paint(); });
    });
    q("#xok").onclick = () => {
      collect();
      if (!x.name){ toast("Ponle nombre"); return; }
      if (!x.sets.length || x.sets.some(s => !s.target)){ toast("Rellena el objetivo de cada serie"); return; }
      if (!x.cues) x.cues = [];
      x._t = 1; day.exercises[ei] = x; sh.close(); dirty(); const y = scrollY; renderEditor(); scrollTo(0, y);
    };
    q("#xdel").onclick = () => { if (!confirm(`¿Quitar «${x.name}» de ${day.label}?`)) return; day.exercises.splice(ei, 1); sh.close(); dirty(); const y = scrollY; renderEditor(); scrollTo(0, y); };
  }
  paint();
  if (!lib) loadLib().then(() => { if (document.body.contains(sh)){ collect(); paint(); } }).catch(() => {});
}

/* ---------- Elegir de la biblioteca ---------- */

    <input id="pq" class="inp" type="search" placeholder="Buscar ejercicio…" autocomplete="off">
    <div class="chips" id="pc"></div><div id="pl"><div class="load">Cargando biblioteca…</div></div>`);
  sh.querySelector("[data-x]").onclick = sh.close;
  const pick = it => { sh.close(); onPick(it); };
  function paint(){
    if (!lib) return;
    const base = lib.filter(it => all || gymOk(it, gym));
    const groups = [...new Set(base.map(it => it.g))];
    $("pg").innerHTML = `${all ? "Toda la biblioteca" : `Para ${esc(gym)}`} · <button class="link" id="pall" style="padding:0">${all ? `solo ${esc(gym)}` : "ver toda"}</button> · <button class="link" id="pre" style="padding:0">actualizar</button>`;
    $("pc").innerHTML = [["", "Todos"], ...groups.map(g => [g, g])].map(([v, t]) => `<button class="chip" data-g="${esc(v)}" aria-pressed="${grp === v}">${esc(t)}</button>`).join("");
    const nq = norm(q), list = base.filter(it => (!grp || it.g === grp) && (!nq || norm(it.n + " " + it.g + " " + it.m).includes(nq)));
    let last = null;
    $("pl").innerHTML = list.map(it => { const h = it.g !== last ? `<div class="blk">${esc(it.g)}</div>` : ""; last = it.g;
      return h + `<button class="li" data-n="${esc(it.n)}"><b>${esc(it.n)}</b><small>${esc(it.m)}${gym === "VivaGym" && it.f ? " · 📷" : ""}${it.v ? " · ▶︎" : ""}${it.b ? ` · B: ${esc(it.b)}` : ""}</small></button>`; }).join("")
      + (q.trim() ? `<button class="ghost" id="pnew" style="margin-top:10px">＋ Usar «${esc(q.trim())}» (no está en la biblioteca)</button>` : "")
      + (!list.length && !q.trim() ? `<div class="empty">Nada en este grupo.</div>` : "");
    $("pall").onclick = () => { all = !all; grp = ""; paint(); };
    $("pre").onclick = async () => { $("pl").innerHTML = `<div class="load">Actualizando…</div>`; try { await loadLib(true); } catch(e){ toast("No se pudo actualizar"); } paint(); };
    $("pc").querySelectorAll(".chip").forEach(b => b.onclick = () => { grp = b.dataset.g; paint(); });
    $("pl").querySelectorAll(".li").forEach(b => b.onclick = () => pick(libFind(b.dataset.n)));
    if ($("pnew")) $("pnew").onclick = () => pick({ g: "", n: q.trim(), m: "", b: "", v: "", va: [], f: "", no: "" });
  }
  $("pq").oninput = e => { q = e.target.value; paint(); };
  if (lib) paint();
  loadLib(!!lib).then(paint).catch(e => { if (!lib) $("pl").innerHTML = `<div class="empty">${e.message === "script" ? "Falta actualizar el código de la hoja (Apps Script)." : "No se pudo cargar la biblioteca."}</div>`; });
}

/* ---------- Guardar ---------- */
async function saveEd(){
  const b = $("eds"), name = ed.name.trim(), c = clone(ed.client);
  if (!name){ toast("Falta el nombre"); return; }
  const emptyDay = c.days.find(d => !d.exercises.length);
  if (emptyDay){ toast(`«${emptyDay.label}» no tiene ejercicios`); return; }
  c.name = name;
  c.days.forEach(d => d.exercises.forEach(ex => { if (ex._t){ syncAlts(ex); delete ex._t; } }));
  b.disabled = true; b.textContent = "Guardando…";
  let r = null;
  try {
    r = await api(ed.isNew ? { action: "panelNew", key, app: ed.app, name, client: c }
                           : { action: "panelSave", key, app: ed.app, code: ed.code, ver: ed.ver, name, client: c });
  } catch(e){}
  if (r && r.ok){
    if (ed.isNew){
      const code = r.code, app0 = ed.app;
      ed = null; sel = code; ctab = "rut"; data = null; load(true);
      const sh = sheet(`<div class="sh-h"><div><h3>Perfil creado ✓</h3><p>${esc(name)} · ${esc(app0)}</p></div><button class="icon-b" data-x>Cerrar</button></div>
        <p class="note">Su código de acceso (ya está en «Clientes y PIN»):</p>
        <div class="code">${esc(code)}</div>
        <button class="btn" id="cp">Copiar código</button>`);
      sh.querySelector("[data-x]").onclick = sh.close;
      $("cp").onclick = async () => { try { await navigator.clipboard.writeText(code); toast("Copiado"); } catch(e){ toast(code); } };
      return;
    }
    ed.ver = r.ver; ed.client = c; ed.dirty = false; routCache[ed.code] = null;
    toast(r.same ? "No había cambios" : "Guardado ✓ Lo verá al abrir su app");
    renderEditor();
    api({ action: "panel", key, app: appId }).then(x => { if (x && x.ok) setData(x); }).catch(() => {});
    return;
  }
  b.disabled = false; b.textContent = ed.isNew ? "Crear perfil" : "Guardar";
  const er = r && r.error;
  if (er === "clave"){ store.del("cp-key"); key = null; ed = null; renderLogin("La clave cambió. Ponla de nuevo."); return; }
  alert(er === "cambio" ? "Esta rutina se cambió desde otro sitio mientras la editabas. Sal y vuelve a abrirla para no pisar esos cambios."
      : er === "accion" ? "Falta actualizar el código de la hoja (Apps Script) para poder guardar rutinas."
      : r && r.msg ? "No se pudo guardar: " + r.msg : "No se pudo guardar. Revisa la conexión y prueba de nuevo.");
}


/* =====================================================================
   COBROS Y RENOVACIONES (antes la app «Cobros Crisxlift»)
   Los clientes que pagan viven en la pestaña «Cobros» de la hoja.
   La app calcula sola cuándo vence cada periodo (mensual = 1 mes, trimestral = 3).
   ===================================================================== */
const PLANS = { trimestral: { label: "Trimestral", months: 3 }, mensual: { label: "Mensual", months: 1 } };
let cob = store.get("cp-cobros"), cobLoading = false, cobFilter = "todos", cobQ = "";
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayStr = () => ymd(new Date());
const parseD = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addMonths = (s, k) => { const d = parseD(s), day = d.getDate(), t = new Date(d.getFullYear(), d.getMonth() + k, 1); t.setDate(Math.min(day, new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate())); return ymd(t); };
const dBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const fDate = s => parseD(s).toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" }).replace(".", "");
const money = n => (Number(n) || 0).toLocaleString("es-ES", { maximumFractionDigits: 2 }) + " €";

function cobStatus(c){
  const venc = addMonths(c.inicio, (PLANS[c.plan] || PLANS.trimestral).months), left = dBetween(todayStr(), venc);
  const sev = c.archivado ? "off" : left < 0 ? "bad" : left <= 7 ? "warn" : !c.pagado ? "pend" : "ok";
  return { venc, left, sev };
}
async function loadCobros(){
  render();                                   /* muestra lo último guardado mientras actualiza */
  cobLoading = true; paintUpd();
  try {
    const r = await api({ action: "panelCobros", key });
    if (r && r.ok){ cob = r; store.set("cp-cobros", r); cobLoading = false; render(); return; }
    if (r && r.error === "clave"){ store.del("cp-key"); key = null; renderLogin("La clave cambió. Ponla de nuevo."); return; }
  } catch(e){}
  cobLoading = false; paintUpd(true);
}
function paintUpdCobros(fail){
  const u = document.getElementById("upd"); if (!u) return;
  u.textContent = cobLoading ? "Actualizando…" : fail ? "Sin conexión: mostrando lo último guardado" : cob ? `Actualizado ${agoTxt(daysAgo(cob.at))} a las ${hhmm(cob.at)}` : "";
}
/* Guarda en la hoja y refresca la lista con lo que devuelve */
async function cobSend(body, okMsg){
  try {
    const r = await api({ ...body, key });
    if (r && r.ok){ cob = r; store.set("cp-cobros", r); if (okMsg) toast(okMsg); render(); return true; }
    if (r && r.error === "clave"){ store.del("cp-key"); key = null; renderLogin("La clave cambió. Ponla de nuevo."); return false; }
    toast(r && r.msg ? "No se pudo guardar: " + r.msg : "No se pudo guardar. Prueba otra vez.");
  } catch(e){ toast("Sin conexión. Prueba otra vez."); }
  return false;
}
const cobSave = (c, msg) => cobSend({ action: "panelCobroSave", cliente: c }, msg);

function renderCobros(){
  const head = topHTML();
  if (!cob){ app.innerHTML = head + `<div class="load">Cargando cobros…</div>`; wireTop(); paintUpd(); return; }
  const cl = cob.clientes || [], act = cl.filter(c => !c.archivado), st = new Map(cl.map(c => [c.id, cobStatus(c)]));
  const mes = todayStr().slice(0, 7);
  let cobrado = 0; cl.forEach(c => (c.pagos || []).forEach(p => { if (String(p.fecha).slice(0, 7) === mes) cobrado += Number(p.importe) || 0; }));
  const k = {
    todos: act.length, pronto: act.filter(c => { const l = st.get(c.id).left; return l >= 0 && l <= 7; }).length,
    vencidos: act.filter(c => st.get(c.id).left < 0).length, pendientes: act.filter(c => !c.pagado).length, bajas: cl.filter(c => c.archivado).length
  };
  let rows = cl.filter(c => {
    const s = st.get(c.id);
    if (cobFilter === "bajas") return c.archivado;
    if (c.archivado) return false;
    if (cobFilter === "pronto") return s.left >= 0 && s.left <= 7;
    if (cobFilter === "vencidos") return s.left < 0;
    if (cobFilter === "pendientes") return !c.pagado;
    return true;
  });
  const q = norm(cobQ.trim()); if (q) rows = rows.filter(c => norm(c.nombre).includes(q));
  rows.sort((a, b) => st.get(a.id).venc.localeCompare(st.get(b.id).venc) || a.nombre.localeCompare(b.nombre));
  const tile = (f, cls, val, txt) => `<button class="${cls}" data-cf="${f}" aria-pressed="${cobFilter === f}"><b>${val}</b><small>${txt}</small></button>`;
  const chips = [["todos", "Todos"], ["pronto", "Vencen pronto"], ["vencidos", "Vencidos"], ["pendientes", "Pendientes"], ["bajas", "Bajas"]];
  app.innerHTML = head + `
    <div class="sum4">
      ${tile("pronto", "hot", k.pronto, "vencen en 7 días")}
      ${tile("vencidos", "r", k.vencidos, "vencidos")}
      ${tile("pendientes", "a", k.pendientes, "pagos pendientes")}
      <div class="money"><b>${money(cobrado)}</b><small>cobrado en ${new Date().toLocaleDateString("es-ES", { month: "long" })}</small></div>
    </div>
    <div class="chips">${chips.map(([id, l]) => `<button class="chip" data-cf="${id}" aria-pressed="${cobFilter === id}">${l} · ${k[id]}</button>`).join("")}</div>
    <input id="cbq" class="inp" type="search" placeholder="🔍 Buscar cliente…" autocomplete="off" value="${esc(cobQ)}" style="margin:6px 0 8px">
    <div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px"><button class="ghost" id="cbnew">＋ Cliente que paga</button><button class="icon-b" id="cbpr">Precios</button></div>
    <div class="cl">${rows.map(c => { const s = st.get(c.id), pl = (PLANS[c.plan] || PLANS.trimestral).label;
      const pill = c.archivado ? `<span class="tag">De baja</span>` : s.left < 0 ? `<span class="tag r">Vencido hace ${-s.left} ${-s.left === 1 ? "día" : "días"}</span>` : s.left === 0 ? `<span class="tag a">Vence hoy</span>` : s.left <= 7 ? `<span class="tag a">Vence en ${s.left} ${s.left === 1 ? "día" : "días"}</span>` : `<span class="tag g">Al día</span>`;
      const pay = c.archivado ? "" : c.pagado ? `<span class="tag g">Pagado</span>` : `<span class="tag a">Pago pendiente</span>`;
      let x = "";
      if (!c.archivado){
        if (!c.pagado) x += `<button class="pri" data-ca="pagar" data-id="${esc(c.id)}">Marcar pagado · ${money(c.precio)}</button>`;
        if (c.pagado && s.left <= 7) x += `<button class="lt" data-ca="renovar" data-id="${esc(c.id)}">Renovar periodo</button>`;
      } else x += `<button data-ca="reactivar" data-id="${esc(c.id)}">Reactivar</button>`;
      x += `<button data-ca="editar" data-id="${esc(c.id)}">Editar</button>`;
      return `<article class="cb s-${s.sev}">
        <div><div class="cb-n">${esc(c.nombre)}</div><div class="cb-m">${pl} · ${fDate(c.inicio)} → <b>${fDate(s.venc)}</b></div><div style="margin-top:6px">${pill.replace('class="tag', 'style="margin-left:0" class="tag')}${pay}</div>${c.notas ? `<div class="cb-m" style="margin-top:4px">📝 ${esc(c.notas)}</div>` : ""}</div>
        <div class="cb-a">${money(c.precio)}<small>${c.plan === "mensual" ? "al mes" : "cada 3 meses"}</small></div>
        <div class="cb-x">${x}</div>
      </article>`; }).join("") || `<div class="empty">${cl.length ? "Nadie en este filtro 🙌" : "Aún no hay clientes. Pulsa «＋ Cliente que paga»."}</div>`}</div>`;
  wireTop(); paintUpd();
  app.querySelectorAll("[data-cf]").forEach(b => b.onclick = () => { cobFilter = cobFilter === b.dataset.cf && b.dataset.cf !== "todos" ? "todos" : b.dataset.cf; render(); });
  const bq = $("cbq"); bq.oninput = () => { cobQ = bq.value; const pos = bq.selectionStart; render(); const n = $("cbq"); n.focus(); n.setSelectionRange(pos, pos); };
  $("cbnew").onclick = () => cobroForm(null);
  $("cbpr").onclick = preciosForm;
  app.querySelectorAll("[data-ca]").forEach(b => b.onclick = () => {
    const c = cl.find(x => x.id === b.dataset.id); if (!c) return;
    const a = b.dataset.ca; b.disabled = true;
    if (a === "pagar") cobSave({ ...c, pagado: true, pagos: [...(c.pagos || []), { fecha: todayStr(), importe: Number(c.precio) || 0, periodo: c.inicio }] }, `${c.nombre}: pago registrado`);
    else if (a === "renovar"){ const v = cobStatus(c).venc; cobSave({ ...c, inicio: v, pagado: false }, `Nuevo periodo desde ${fDate(v)}`); }
    else if (a === "reactivar") cobSave({ ...c, archivado: false }, "Cliente reactivado");
    else { b.disabled = false; cobroForm(c); }
  });
}

function cobroForm(c){
  const isNew = !c, pr = (cob && cob.precios) || {};
  const d = c ? clone(c) : { nombre: "", plan: "trimestral", precio: pr.trimestral ?? "", inicio: todayStr(), pagado: true, notas: "", pagos: [] };
  let plan = d.plan, pagos = (d.pagos || []).slice();
  const sh = sheet(`<div class="sh-h"><div><h3>${isNew ? "Nuevo cliente" : esc(d.nombre)}</h3><p>Cobros y renovaciones</p></div><button class="icon-b" data-x>Cerrar</button></div>
    <label class="fl"><span>Nombre</span><input id="cfN" value="${esc(d.nombre)}" placeholder="Nombre y apellido"></label>
    <div class="fl"><span>Plan</span><div class="pl" id="cfP"><button type="button" data-p="trimestral" aria-pressed="${plan === "trimestral"}">Trimestral</button><button type="button" data-p="mensual" aria-pressed="${plan === "mensual"}">Mensual</button></div></div>
    <div class="row2"><label class="fl"><span>Precio (€)</span><input id="cfPr" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(d.precio)}"></label>
      <label class="fl"><span>Inicio del periodo</span><input id="cfI" type="date" value="${esc(d.inicio)}"></label></div>
    <p class="note" id="cfV" style="margin:0 0 6px"></p>
    ${isNew ? `<label class="tg"><input id="cfPg" type="checkbox" ${d.pagado ? "checked" : ""}> Ya pagó este periodo</label>` : ""}
    <label class="fl"><span>Notas</span><textarea id="cfNo" rows="2" placeholder="Ej.: paga con Bizum, Mercado Pago…">${esc(d.notas)}</textarea></label>
    ${!isNew && pagos.length ? `<div class="fl"><span>Pagos registrados</span><div class="hist" id="cfH"></div></div>` : ""}
    <button class="btn" id="cfS" style="margin-top:12px">${isNew ? "Añadir" : "Guardar"}</button>
    ${isNew ? "" : `<button class="ghost" id="cfA" style="margin-top:8px">${d.archivado ? "Reactivar" : "Dar de baja"}</button><button class="danger" id="cfD">Borrar cliente</button>`}`);
  sh.querySelector("[data-x]").onclick = sh.close;
  const upd = () => { const i = $("cfI").value; $("cfV").innerHTML = i ? `Vence el <b>${fDate(addMonths(i, PLANS[plan].months))}</b>` : ""; };
  upd(); $("cfI").oninput = upd;
  $("cfP").onclick = e => {
    const b = e.target.closest("[data-p]"); if (!b) return;
    const prev = plan; plan = b.dataset.p;
    $("cfP").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x.dataset.p === plan));
    const p = $("cfPr"); if (prev !== plan && (p.value === "" || Number(p.value) === Number(pr[prev]))) p.value = pr[plan] ?? "";
    upd();
  };
  const paintH = () => { const h = $("cfH"); if (!h) return;
    h.innerHTML = pagos.map((p, i) => ({ p, i })).reverse().map(({ p, i }) => `<div><span>${fDate(p.fecha)}</span><b>${money(p.importe)}</b><button class="link" data-del="${i}">Quitar</button></div>`).join("") || `<div><span class="note">Sin pagos</span></div>`;
    h.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { pagos.splice(+b.dataset.del, 1); paintH(); });
  };
  paintH();
  $("cfS").onclick = async () => {
    const nombre = $("cfN").value.trim(), inicio = $("cfI").value;
    if (!nombre){ $("cfN").focus(); return toast("Escribe el nombre del cliente"); }
    if (!inicio){ $("cfI").focus(); return toast("Pon la fecha de inicio"); }
    const precio = Number($("cfPr").value) || 0;
    const body = { ...d, nombre, plan, precio, inicio, notas: $("cfNo").value.trim(), archivado: !!d.archivado };
    if (isNew){ body.pagado = $("cfPg").checked; body.pagos = body.pagado ? [{ fecha: todayStr(), importe: precio, periodo: inicio }] : []; body.creado = todayStr(); }
    else body.pagos = pagos;
    const b = $("cfS"); b.disabled = true; b.textContent = "Guardando…";
    if (await cobSave(body, isNew ? `${nombre} añadido` : "Cambios guardados")) sh.close();
    else { b.disabled = false; b.textContent = isNew ? "Añadir" : "Guardar"; }
  };
  if (!isNew){
    $("cfA").onclick = async () => { if (await cobSave({ ...d, archivado: !d.archivado }, d.archivado ? "Cliente reactivado" : "Cliente dado de baja")) sh.close(); };
    $("cfD").onclick = async () => {
      if (!confirm(`¿Borrar a ${d.nombre} y todo su historial de pagos? No se puede deshacer.`)) return;
      if (await cobSend({ action: "panelCobroDel", id: d.id }, "Cliente borrado")) sh.close();
    };
  }
}

function preciosForm(){
  const pr = (cob && cob.precios) || {};
  const sh = sheet(`<div class="sh-h"><div><h3>Precios por defecto</h3><p>Se rellenan solos al añadir un cliente</p></div><button class="icon-b" data-x>Cerrar</button></div>
    <div class="row2"><label class="fl"><span>Trimestral (€)</span><input id="ppT" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(pr.trimestral ?? "")}"></label>
      <label class="fl"><span>Mensual (€)</span><input id="ppM" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(pr.mensual ?? "")}" placeholder="Sin definir"></label></div>
    <p class="note">Cada cliente puede tener su propio precio: esto es solo el que aparece al crear uno nuevo.</p>
    <button class="btn" id="ppS" style="margin-top:12px">Guardar</button>`);
  sh.querySelector("[data-x]").onclick = sh.close;
  $("ppS").onclick = async () => { if (await cobSend({ action: "panelPrecios", precios: { trimestral: $("ppT").value, mensual: $("ppM").value } }, "Precios guardados")) sh.close(); };
}

if (!key) renderLogin(); else if (view === "cobros") loadCobros(false); else load(false);
</script>
